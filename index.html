<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f3ed">
	<title>號碼轉盤 | 1–19 抽取</title>
	<link rel="stylesheet" href="css.css">
	<script src="js.js" defer></script>
</head>
<body>
	<div class="page-shell">
		<header class="topbar">
			<a class="wordmark" href="#top" aria-label="號碼轉盤首頁">
				<span class="wordmark-mark" aria-hidden="true">✳</span>
				<span>NUMBER DRAW</span>
			</a>
			<div class="topbar-tools">
				<p class="topbar-note">不重複抽選 <span aria-hidden="true">/</span> 1—19</p>
				<label class="sound-setting" for="sound-toggle">
					<input id="sound-toggle" type="checkbox" checked>
					<span class="sound-switch" aria-hidden="true"></span>
					<span>音效</span>
				</label>
			</div>
		</header>

		<main id="top">
			<section class="draw-layout" aria-labelledby="page-title">
				<div class="wheel-column">
					<div class="section-heading">
						<p class="eyebrow">NUMBER DRAW</p>
						<h1 id="page-title">號碼轉盤<span class="title-period">.</span></h1>
						<p class="subtitle">隨機抽取，抽過的號碼即刻移除。</p>
					</div>

					<div class="wheel-stage">
						<span class="stage-spark spark-one" aria-hidden="true">✳</span>
						<span class="stage-spark spark-two" aria-hidden="true">✦</span>
						<div class="wheel-frame">
							<div class="pointer" aria-hidden="true"></div>
							  <svg class="wheel" viewBox="0 0 600 600" role="img" aria-label="號碼轉盤，包含 1 到 19 號">
								<g class="wheel-segments"></g>
								<circle class="wheel-hub" cx="300" cy="300" r="43"></circle>
								<text class="wheel-hub-label" x="300" y="306" text-anchor="middle">抽</text>
							</svg>
						</div>
					</div>

					<p class="wheel-caption"><span class="caption-dot" aria-hidden="true"></span>每個號碼只有一次機會</p>
				</div>

				<aside class="draw-panel" aria-label="抽獎資訊">
					<div class="panel-topline">
						<p class="eyebrow">DRAW CONTROL</p>
						<span class="round-count">已抽 <span id="draw-count">0</span> / 19</span>
					</div>

					<div class="result-block" aria-live="polite" aria-atomic="true">
						<p class="result-label">本次抽出號碼</p>
						<p class="result-number" id="result-number">--</p>
						<p class="result-message" id="result-message">準備好揭曉了嗎？</p>
					</div>

					<button class="draw-button" id="draw-button" type="button">
						<span>開始抽獎</span>
						<span class="button-arrow" aria-hidden="true">↗</span>
					</button>
					<button class="reset-button" id="reset-button" type="button" title="重新開始抽獎">
						<span aria-hidden="true">↺</span> 重置抽獎
					</button>

					<div class="panel-divider"></div>

					<section class="remaining-section" aria-labelledby="remaining-title">
						<div class="list-heading">
							<h2 id="remaining-title">待抽號碼</h2>
							<span class="remaining-count" id="remaining-count">19</span>
						</div>
						<ol class="number-list" id="number-list" aria-label="尚未抽出的號碼"></ol>
					</section>

					<section class="winners-section" aria-labelledby="winners-title">
						<div class="list-heading">
							<h2 id="winners-title">已抽出號碼</h2>
							<span class="history-count" id="history-count">0</span>
						</div>
						<ol class="winner-list" id="winner-list" aria-live="polite">
							  <li class="empty-history">抽出的號碼會顯示在這裡</li>
						</ol>
					</section>
				</aside>
			</section>
		</main>

		<footer class="page-footer">
			<span>MAKE THIS MOMENT COUNT</span>
			<span>1 — 19 <span class="footer-star" aria-hidden="true">✳</span> DRAW</span>
		</footer>
	</div>

		<dialog class="result-dialog" id="result-dialog" aria-labelledby="dialog-title">
			<div class="dialog-content">
				<p class="eyebrow">NUMBER DRAW</p>
				<h2 id="dialog-title">抽出號碼</h2>
				<p class="dialog-number" id="dialog-number">--</p>
				<p class="dialog-copy">確認後，這個號碼才會從轉盤移除。</p>
				<button class="confirm-button" id="confirm-draw" type="button">確認並移除號碼</button>
			</div>
		</dialog>
</body>
</html>
